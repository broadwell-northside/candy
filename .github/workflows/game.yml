# Stillwater, the private island game in game/.
# This job stays separate from the Easy Studio app tests.

name: Game

on:
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/game.yml"
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/game.yml"

jobs:
  stillwater:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint the game tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff check game/tools

      - name: Importer tests
        run: python game/tools/test_import.py

      - name: Door puzzle level and its hash
        run: python game/tools/puzzle_level.py check

      - name: Install Godot 4.7.2
        run: |
          curl -fsSL -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Headless tests
        run: godot --headless --rendering-method gl_compatibility --path game res://scenes/tests.tscn

      - name: Install export templates
        run: |
          curl -fsSL -L -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Export Linux and macOS
        run: |
          mkdir -p game/build/linux game/build/macos
          godot --headless --path game --export-release "Linux" build/linux/Stillwater.x86_64
          godot --headless --path game --export-release "macOS" build/macos/Stillwater.zip

      - name: Upload the Linux build
        uses: actions/upload-artifact@v4
        with:
          name: stillwater-linux
          path: game/build/linux/

      - name: Upload the macOS build
        uses: actions/upload-artifact@v4
        with:
          name: stillwater-macos
          path: game/build/macos/
