<!doctype html>
<html lang="en" data-theme="match">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Studio</title>
<script>
(function () {
  var theme = "match";
  try {
    var raw = localStorage.getItem("es.theme");
    if (raw !== null) {
      var v = JSON.parse(raw);
      if (v === "light" || v === "dark" || v === "match") theme = v;
    }
  } catch (e) {}
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
